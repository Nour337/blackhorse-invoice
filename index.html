<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بيان أدهم - BLACK HORSE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#d9dee3;font-family:Arial,Tahoma,sans-serif}
body{display:flex;justify-content:center;padding:8px 0 24px}
.wrap{width:min(100vw,680px)}
.sheet{position:relative;width:100%;aspect-ratio:2/3;background:#fff 0 0/100% 100% no-repeat;overflow:hidden;--u:.66px}
.f{position:absolute;border:0;outline:0;background:transparent;color:#101820;font-family:Arial,Tahoma,sans-serif;font-weight:700;min-width:0;padding:0 calc(var(--u)*10);border-radius:4px;direction:rtl}
.f:focus{background:rgba(242,140,24,.12);box-shadow:0 0 0 2px #f28c18}
.c{text-align:center}.r{text-align:right}.l{text-align:left;direction:ltr}
.notes{resize:none;line-height:1.15;padding-top:calc(var(--u)*4);overflow:hidden}
.ro{pointer-events:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 8px 0}
button{border:0;border-radius:10px;padding:13px 10px;background:#092b4b;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button.main{background:#f28c18;grid-column:1/-1;font-size:17px}
button.warn{background:#a30000}
#msg{text-align:center;font-size:13px;color:#092b4b;min-height:20px;padding-top:6px}
@page{size:A4;margin:0}
@media print{html,body{background:#fff}body{padding:0}.wrap{width:198mm}.actions,#msg{display:none}.f{background:transparent!important;box-shadow:none!important}}
</style>
</head>

// ---------- أدوات ----------
const AR='٠١٢٣٤٥٦٧٨٩',PR='۰۱۲۳۴۵۶۷۸۹';
function norm(s){return String(s||'').replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[۰-۹]/g,d=>PR.indexOf(d)).replace(/[٫]/g,'.').replace(/[٬،,\s]/g,'')}
function num(e){const n=parseFloat(norm(e.value));return isFinite(n)?n:0}
const round2=x=>Math.round((x+Number.EPSILON)*100)/100;
const fmt=x=>round2(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad3=n=>String(n).padStart(3,'0');
function today(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
// bh_last = آخر رقم فاتورة اتبعت فعلاً
function getLast(){try{const v=localStorage.getItem('bh_last');if(v!==null)return parseInt(v)||0;const o=parseInt(localStorage.getItem('bh_next'));return o?o-1:0}catch(e){return 0}}
function setLast(n){try{localStorage.setItem('bh_last',n)}catch(e){}}
function markIssued(){const n=parseInt(norm(el.no.value));if(n&&n>getLast())setLast(n)}
function nextNo(){return pad3(getLast()+1)}
function scale(){const u=sheet.clientWidth/W;sheet.style.setProperty('--u',u+'px');
 F.forEach(f=>{f.el.style.fontSize=f.size*u+'px'});
 F.filter(f=>f.fit).forEach(f=>{let s=f.size;while(f.el.scrollWidth>f.el.clientWidth+1&&s>14){s-=2;f.el.style.fontSize=s*u+'px'}});}
function recalc(){
 let sum=0;
 for(let i=0;i<6;i++)sum+=round2(num(el['q'+i])*num(el['p'+i]));
 el.total.value=fmt(sum);
 el.remaining.value=fmt(sum-num(el.paid));
 scale();
}
document.querySelectorAll('.qty,.price,#paid').forEach(e=>e.addEventListener('input',recalc));
addEventListener('resize',scale);
el.no.value=nextNo();el.date.value=today();
// ---------- PDF ----------
const bgImg=new Image();const bgReady=new Promise(r=>{bgImg.onload=r;bgImg.src=BG});
function wrap(ctx,t,maxW){const words=t.split(/\s+/),lines=[];let cur='';
 for(const w of words){const test=cur?cur+' '+w:w;if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w}else cur=test}
 if(cur)lines.push(cur);return lines}
async function render(){
 await bgReady;const S=1.5,cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;
 const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);
 c.drawImage(bgImg,0,0,cv.width,cv.height);c.textBaseline='middle';
 for(const f of F){
  const v=f.el.value;if(!v)continue;
  const pad=(f.pad||10);const maxW=(f.w-pad*2)*S;const x0=f.x*S,y0=f.y*S,w=f.w*S,h=f.h*S;
  c.fillStyle=f.color||'#101820';
  c.direction=(f.al==='l'||f.type==='num')?'ltr':'rtl';
  if(f.type==='area'){
   let s=f.size*S,lines;
   for(;;){c.font=`700 ${s}px Arial,Tahoma,sans-serif`;lines=wrap(c,v,maxW);if(lines.length*s*1.15<=h-4*S||s<14*S)break;s-=2*S}
   c.textAlign='right';const lh=s*1.15;let y=y0+(h-lines.length*lh)/2+lh/2;
   for(const l of lines){c.fillText(l,x0+w-pad*S,y);y+=lh}
   continue}
  let s=f.size*S;c.font=`700 ${s}px Arial,Tahoma,sans-serif`;
  while(c.measureText(v).width>maxW&&s>12*S){s-=2*S;c.font=`700 ${s}px Arial,Tahoma,sans-serif`}
  const cy=y0+h/2+S;
  if(f.al==='c'){c.textAlign='center';c.fillText(v,x0+w/2,cy)}
  else if(f.al==='r'){c.textAlign='right';c.fillText(v,x0+w-pad*S,cy)}
  else{c.textAlign='left';c.fillText(v,x0+pad*S,cy)}
 }
 return cv}
function buildPdf(jpg,pw,ph){
 const enc=new TextEncoder(),parts=[],off=[];let len=0;
 const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
 const W_=595.28,H_=+(W_*ph/pw).toFixed(2);
 push('%PDF-1.4\n');
 const obj=(n,body)=>{off[n]=len;push(`${n} 0 obj\n`);body.forEach(push);push('\nendobj\n')};
 obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
 obj(2,['<< /Type /Pages /Kids [3 0 R] /Count 1 >>']);
 obj(3,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W_} ${H_}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`]);
 obj(4,[`<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`,jpg,'\nendstream']);
 const cs=`q ${W_} 0 0 ${H_} 0 0 cm /Im0 Do Q`;
 obj(5,[`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`]);
 const xr=len;let x=`xref\n0 6\n0000000000 65535 f \n`;
 for(let i=1;i<=5;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
 push(x+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
 return new Blob(parts,{type:'application/pdf'})}
async function makePdf(){
 const cv=await render();
 const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));
 const jpg=new Uint8Array(await blob.arrayBuffer());
 const name='BlackHorse-'+(norm(el.no.value)||'bayan')+'.pdf';
 return new File([buildPdf(jpg,cv.width,cv.height)],name,{type:'application/pdf'})}
const msg=t=>{document.getElementById('msg').textContent=t};
function download(file){
 const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
document.getElementById('bDown').onclick=async()=>{msg('جاري تجهيز الملف...');try{download(await makePdf());markIssued();msg('تم تحميل ملف PDF ✅ — اضغط "بيان جديد" للفاتورة الجاية')}catch(e){msg('حصل خطأ: '+e.message)}};

  else{download(f);markIssued();msg('المشاركة المباشرة غير مدعومة هنا، تم تحميل الملف — ابعته من واتساب/الإيميل ✅')}

document.getElementById('bPrint').onclick=()=>{markIssued();window.print()};
document.getElementById('bClear').onclick=()=>{

 el.no.value=nextNo();el.date.value=today();recalc();msg('')};
